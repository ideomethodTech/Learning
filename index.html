<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eco Sprint Viewer</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />

    <!-- 3D Viewer & Icons -->
    <script
      type="module"
      src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div id="model-wrapper">
      <!-- Loader -->
      <div id="loader"><div class="strike-loader">STRIKECO</div></div>

      <!-- 3D Model -->
      <model-viewer
        id="ecoModel"
        src="blue_cresta.glb"
        camera-controls
        interaction-prompt="none"
        shadow-intensity="1"
       camera-target="0m 0m 0m"
        camera-orbit="-90deg 80deg 2m"
      >
      </model-viewer>

      <!-- Info Overlay (Top Left) -->
      <div id="infoOverlay">
        <div class="info-header">
          <span id="infoTitle">Feature Name</span>
          <i class="fas fa-times close-btn" onclick="closeInfo()"></i>
        </div>
        <div class="info-body" id="infoDesc"></div>
      </div>

      <!-- Floating Sub Menu (Middle Layer) -->
      <div id="subMenuBar"></div>

      <!-- Main Navigation (Bottom Bar) -->
      <div class="feature-bar">
        <div class="feature-item" onclick="handleMenu('Color', this)">
          <i class="fas fa-palette"></i> Color
        </div>
        <div class="feature-item" onclick="handleMenu('Design', this)">
          <i class="fas fa-motorcycle"></i> Design
        </div>
        <div class="feature-item" onclick="handleMenu('Performance', this)">
          <i class="fas fa-tachometer-alt"></i> Performance
        </div>
        <div class="feature-item" onclick="handleMenu('SmartXonnect', this)">
          <i class="fas fa-mobile-alt"></i> SmartXonnect
        </div>
        <div class="feature-item" onclick="handleMenu('Safety', this)">
          <i class="fas fa-shield-alt"></i> Safety
        </div>
        <div class="feature-item" onclick="handleMenu('Comfort', this)">
          <i class="fas fa-couch"></i> Comfort
        </div>
        <div class="feature-item" onclick="handleMenu('Charging', this)">
          <i class="fas fa-bolt"></i> Charging
        </div>
      </div>
    </div>

    <!-- Logic -->
    <script type="module" src="script.js"></script>
  </body>
</html>
  </body>
</html>
